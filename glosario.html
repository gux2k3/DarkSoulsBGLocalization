<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimorio de Localización</title>
    <style>
        /* --- VARIABLES Y TEMA OSCURO --- */
        :root[data-theme="dark"] {
            --bg-main: #0b0b0b; --bg-panel: #141311; --border: #3c3222;
            --text-main: #d1c4a9; --text-muted: #8b8173;
            --accent: #c07a3c; --accent-hover: #a06028; 
            --success: #388e3c; --success-bg: #183018;
            --danger: #d32f2f; --danger-bg: #3b1414;
        }

        /* --- MODO CLARO (Controlado por el Cascarón) --- */
        :root[data-theme="light"] {
            --bg-main: #f4f1ea; --bg-panel: #ffffff; --border: #d1c4a9;
            --text-main: #2a2520; --text-muted: #6b6356;
            --accent: #c07a3c; --accent-hover: #a06028; 
            --success: #4caf50; --success-bg: #e8f5e9;
            --danger: #e57373; --danger-bg: #ffebee;
        }

        body { 
            background-color: var(--bg-main); color: var(--text-main); 
            font-family: 'Georgia', serif; margin: 0; padding: 15px; 
            min-height: 100vh; transition: all 0.3s;
        }
        
        h1 { text-align: center; font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 15px; color: var(--accent); }
        
        /* --- BOTONES PRINCIPALES --- */
        .btn-n8n { background: transparent; color: var(--accent); padding: 12px; border: 1px solid var(--accent); width: 100%; font-weight: bold; font-size: 16px; margin-bottom: 15px; border-radius: 2px; cursor: pointer; transition: all 0.3s ease; }
        .btn-n8n:hover { background: var(--accent); color: var(--bg-main); }

        /* --- FORMULARIO FLEXBOX (Proponer Término) --- */
        .formulario-glosario { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: var(--bg-panel); padding: 15px; border: 1px solid var(--border); margin-bottom: 25px; border-radius: 2px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
        .input-box { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border); padding: 8px; border-radius: 2px; font-family: 'Georgia', serif; font-size: 14px; }
        .input-box:focus { outline: none; border-color: var(--accent); }
        .btn-add { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border); padding: 8px 15px; cursor: pointer; height: 35px; font-weight: bold; transition: 0.2s; white-space: nowrap; }
        .btn-add:hover { border-color: var(--accent); color: var(--accent); }

        /* --- TARJETAS DE APROBACIÓN --- */
        .card { background-color: var(--bg-panel); border: 1px solid var(--border); margin-bottom: 15px; padding: 15px; border-radius: 2px; transition: all 0.3s; }
        .term-title { font-size: 19px; color: var(--text-main); margin: 0 0 5px 0; font-weight: normal; }
        .term-category { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px;}
        .term-translation { font-size: 16px; color: var(--accent); margin-bottom: 5px; font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; }
        .term-context { font-size: 12px; color: var(--text-muted); margin-bottom: 15px; padding-left: 12px; }
        
        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 2px; font-weight: bold; cursor: pointer; background-color: var(--bg-main); color: var(--text-muted); transition: all 0.2s ease; }
        
        /* Estados de las tarjetas */
        .card.approved .btn-approve { background-color: var(--success-bg); color: var(--success); border-color: var(--success); }
        .card.rejected .btn-reject { background-color: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
        
        .proposal-container { display: none; margin-top: 15px; }
        .proposal-input { width: 100%; box-sizing: border-box; padding: 10px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--accent); margin-bottom: 10px; border-radius: 2px; font-family: 'Georgia', serif; }
        .btn-save { background-color: var(--bg-panel); color: var(--text-main); padding: 8px; border: 1px solid var(--border); width: 100%; border-radius: 2px; cursor: pointer; }
        .btn-save:hover { border-color: var(--accent); color: var(--accent); }
        
        #loading { text-align: center; color: var(--text-muted); font-style: italic; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>📖 Grimorio de Localización</h1>

    <!-- NUEVO: Formulario Flexbox para proponer términos -->
    <div class="formulario-glosario">
        <div class="input-group">
            <label>Categoría</label>
            <input type="text" id="prop-cat" class="input-box" placeholder="Ej. Objeto, Personaje">
        </div>
        <div class="input-group">
            <label>Término (Inglés)</label>
            <input type="text" id="prop-orig" class="input-box" placeholder="Original">
        </div>
        <div class="input-group">
            <label>Traducción</label>
            <input type="text" id="prop-trad" class="input-box" placeholder="Sugerencia">
        </div>
        <div class="input-group" style="flex: 2;">
            <label>Contexto</label>
            <input type="text" id="prop-nota" class="input-box" placeholder="Nota aclaratoria...">
        </div>
        <button class="btn-add" onclick="proponerTermino()">➕ Proponer</button>
    </div>

    <!-- BOTÓN CENTRAL DE GUARDADO LOTE -->
    <button class="btn-n8n" onclick="enviarAn8n()">🔥 Sellar Destino (Actualizar DB)</button>

    <div id="loading">Invocando almas desde la base de datos...</div>
    <div id="glossary-container"></div>

    <script>
        // --- SINCRONIZACIÓN DE TEMA CON CASCARÓN ---
        const temaGuardado = localStorage.getItem('forja_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', temaGuardado);
        window.addEventListener('message', function(event) {
            if (event.data && event.data.accion === 'cambiarTema') {
                document.documentElement.setAttribute('data-theme', event.data.tema);
            }
        });

        // --- RUTAS DE n8n (Las que ya tenías) ---
        const GET_WEBHOOK = 'https://remold-good-gauging.ngrok-free.dev/webhook/obtener-glosario';
        const POST_WEBHOOK = 'https://remold-good-gauging.ngrok-free.dev/webhook/glosario'; 
        const PROPOSE_WEBHOOK = 'https://remold-good-gauging.ngrok-free.dev/webhook/proponer-glosario'; // Necesitarás este webhook para insertar
        
        let glosarioDinamico = [];
        const container = document.getElementById('glossary-container');
        const loadingIndicator = document.getElementById('loading');
        
        // El Cascarón ya gestiona el login, tomamos el token directamente
        const authHeader = localStorage.getItem('api_token');
        const usuarioId = parseInt(localStorage.getItem('usuario_db_id')) || 2;

        if (!authHeader) {
            document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px;">Acceso Denegado. Inicia sesión en el Alimentador.</h2>';
        } else {
            cargarGlosarioDesdeBD();
        }

        // --- LÓGICA DE DATOS ---
        async function cargarGlosarioDesdeBD() {
            try {
                const response = await fetch(GET_WEBHOOK, {
                    headers: { 'Authorization': authHeader, 'ngrok-skip-browser-warning': 'true' }
                });
                
                if (!response.ok) throw new Error('Error de autenticación');
                
                let data = await response.json();
                glosarioDinamico = Array.isArray(data) ? data : [data];
                
                loadingIndicator.style.display = 'none';
                renderizarGlosario();
            } catch (error) {
                loadingIndicator.innerHTML = 'Acceso denegado o servidor desconectado.';
            }
        }

        function renderizarGlosario() {
            container.innerHTML = ''; 
            glosarioDinamico.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `term_${item.id_termino}`;
                const traduccionActual = item.traduccion_sugerida || 'Sin traducción sugerida';
                const nota = item.nota_contexto ? `<div class="term-context">📝 ${item.nota_contexto}</div>` : '';
                card.innerHTML = `
                    <h2 class="term-title">${item.termino_original}</h2>
                    <div class="term-category">${item.categoria || 'Sin categoría'} | Estado: <strong>${item.estado}</strong></div>
                    <div class="term-translation">↳ ${traduccionActual}</div>
                    ${nota}
                    <div class="actions">
                        <button id="btn_approve_${item.id_termino}" class="btn btn-approve" onclick="aprobar(${item.id_termino})">Aprobar</button>
                        <button id="btn_reject_${item.id_termino}" class="btn btn-reject" onclick="rechazar(${item.id_termino})">Rechazar</button>
                    </div>
                    <div class="proposal-container" id="prop_${item.id_termino}">
                        <input type="text" class="proposal-input" id="input_${item.id_termino}" placeholder="Forja tu propia traducción...">
                        <button class="btn-save" onclick="guardarPropuesta(${item.id_termino})">Sellar Traducción Local</button>
                    </div>
                `;
                container.appendChild(card);
                if(item.estado === 'Aprobado') aprobar(item.id_termino, false);
                if(item.estado === 'Rechazado') rechazar(item.id_termino, false);
            });
            cargarProgresoLocal();
        }

        // --- FLUJO DE APROBACIÓN ---
        function aprobar(id, guardarLocal = true) {
            const card = document.getElementById(`term_${id}`);
            card.classList.remove('rejected');
            card.classList.add('approved');
            document.getElementById(`prop_${id}`).style.display = 'none';
            document.getElementById(`btn_approve_${id}`).innerHTML = '✅ Aprobado';
            document.getElementById(`btn_reject_${id}`).innerHTML = 'Rechazar';
            if(guardarLocal) guardarProgresoLocal();
        }

        function rechazar(id, guardarLocal = true) {
            const card = document.getElementById(`term_${id}`);
            card.classList.remove('approved');
            card.classList.add('rejected');
            document.getElementById(`prop_${id}`).style.display = 'block';
            document.getElementById(`btn_reject_${id}`).innerHTML = '❌ Rechazado';
            document.getElementById(`btn_approve_${id}`).innerHTML = 'Aprobar';
            if(guardarLocal) guardarProgresoLocal();
        }

        function guardarPropuesta(id) {
            guardarProgresoLocal();
            alert("Nueva traducción sellada localmente.");
        }

        function guardarProgresoLocal() {
            const estadoLocal = {};
            glosarioDinamico.forEach(item => {
                const card = document.getElementById(`term_${item.id_termino}`);
                if (!card) return;
                let estado = 'Pendiente';
                let propuesta = '';
                if (card.classList.contains('approved')) estado = 'Aprobado';
                if (card.classList.contains('rejected')) {
                    estado = 'Rechazado';
                    propuesta = document.getElementById(`input_${item.id_termino}`).value;
                }
                estadoLocal[item.id_termino] = { estado, propuesta };
            });
            localStorage.setItem('progresoDS_V3', JSON.stringify(estadoLocal));
        }

        function cargarProgresoLocal() {
            const guardado = localStorage.getItem('progresoDS_V3');
            if (!guardado) return;
            const estadoLocal = JSON.parse(guardado);
            Object.keys(estadoLocal).forEach(id => {
                const data = estadoLocal[id];
                const input = document.getElementById(`input_${id}`);
                if (data.estado === 'Aprobado') {
                    aprobar(id, false); 
                } else if (data.estado === 'Rechazado') {
                    rechazar(id, false); 
                    if (input && data.propuesta) {
                        input.value = data.propuesta;
                    }
                }
            });
        }

        // --- ENVIAR LOTE (ACTUALIZAR ESTADOS) ---
        async function enviarAn8n() {
            const resultados = [];
            
            glosarioDinamico.forEach(item => {
                const card = document.getElementById(`term_${item.id_termino}`);
                let estadoFinal = item.estado; 
                let traduccionFinal = item.traduccion_sugerida;

                if (card.classList.contains('approved')) {
                    estadoFinal = 'Aprobado';
                } else if (card.classList.contains('rejected')) {
                    estadoFinal = 'Rechazado';
                    const propuestaText = document.getElementById(`input_${item.id_termino}`).value.trim();
                    if (propuestaText !== '') {
                        traduccionFinal = propuestaText;
                    }
                }

                if (estadoFinal !== item.estado || traduccionFinal !== item.traduccion_sugerida) {
                    resultados.push({
                        id_termino: item.id_termino,
                        estado: estadoFinal,
                        traduccion_sugerida: traduccionFinal,
                        id_usuario_aprueba: usuarioId
                    });
                }
            });

            if (resultados.length === 0) {
                alert("No hay cambios nuevos para forjar en la base de datos.");
                return;
            }

            try {
                const response = await fetch(POST_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
                    body: JSON.stringify({ datos: resultados })
                });

                if (response.ok) {
                    alert('¡Las almas han sido forjadas en la base de datos!');
                    localStorage.removeItem('progresoDS_V3'); 
                    location.reload(); 
                } else {
                    alert('Error al forjar en el servidor.');
                }
            } catch (error) {
                alert('No se pudo conectar al orquestador n8n.');
            }
        }

        // --- NUEVO: PROPONER TÉRMINO ---
        async function proponerTermino() {
            const cat = document.getElementById('prop-cat').value.trim();
            const orig = document.getElementById('prop-orig').value.trim();
            const trad = document.getElementById('prop-trad').value.trim();
            const nota = document.getElementById('prop-nota').value.trim();

            if (!orig || !trad) {
                alert("Se requiere al menos el término original y la traducción.");
                return;
            }

            try {
                // Simulación o conexión real a n8n para insertar
                const response = await fetch(PROPOSE_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
                    body: JSON.stringify({ 
                        categoria: cat, 
                        termino_original: orig, 
                        traduccion_sugerida: trad, 
                        nota_contexto: nota,
                        estado: 'Pendiente',
                        id_usuario_propone: usuarioId
                    })
                });
                
                if(response.ok) {
                    alert("Término propuesto con éxito.");
                    document.getElementById('prop-cat').value = '';
                    document.getElementById('prop-orig').value = '';
                    document.getElementById('prop-trad').value = '';
                    document.getElementById('prop-nota').value = '';
                    cargarGlosarioDesdeBD(); // Recargar la lista
                } else {
                    alert("Error al enviar la propuesta.");
                }
            } catch (error) {
                alert("Fallo de conexión al proponer término.");
            }
        }
    </script>
</body>
</html>
