<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Gran Forja - Dashboard</title>
    <style>
        /* --- VARIABLES DE TEMA --- */
        :root[data-theme="dark"] {
            --bg-main: #0b0b0b;
            --bg-panel: #141311;
            --border: #3c3222;
            --text-main: #d1c4a9;
            --text-muted: #8b8173;
            --accent: #c07a3c;
            --accent-hover: #a06028;
            --shadow: rgba(0,0,0,0.5);
        }

        :root[data-theme="light"] {
            --bg-main: #f4f1ea;
            --bg-panel: #ffffff;
            --border: #d1c4a9;
            --text-main: #2a2520;
            --text-muted: #6b6356;
            --accent: #c07a3c;
            --accent-hover: #a06028;
            --shadow: rgba(0,0,0,0.1);
        }

        body { 
            margin: 0; padding: 0; font-family: 'Georgia', serif; 
            background-color: var(--bg-main); color: var(--text-main); 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- BARRA SUPERIOR --- */
        .topbar {
            height: 60px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            box-shadow: 0 2px 10px var(--shadow); z-index: 100;
        }

        .topbar-left { display: flex; align-items: center; gap: 15px; }
        .hamburger { display: none; font-size: 24px; cursor: pointer; color: var(--accent); }
        .logo { font-size: 20px; font-weight: bold; color: var(--accent); letter-spacing: 1px; }

        .topbar-right { display: flex; align-items: center; gap: 15px; }
        .user-info { font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; }
        
        .btn-icon {
            background: transparent; border: 1px solid var(--border); color: var(--text-main);
            border-radius: 4px; padding: 5px 10px; cursor: pointer; transition: all 0.2s;
        }
        .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-container { display: flex; flex-grow: 1; overflow: hidden; position: relative; }

        /* --- MENÚ LATERAL (TABS) --- */
        .sidebar {
            width: 250px; background-color: var(--bg-panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 20px 0; transition: transform 0.3s ease;
            z-index: 50;
        }

        .nav-item {
            padding: 15px 25px; cursor: pointer; border-left: 3px solid transparent;
            color: var(--text-muted); font-size: 16px; transition: all 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .nav-item:hover { background-color: rgba(192, 122, 60, 0.1); color: var(--text-main); }
        .nav-item.active { border-left-color: var(--accent); color: var(--accent); background-color: rgba(192, 122, 60, 0.05); font-weight: bold; }

        /* --- IFRAME (LA HERRAMIENTA) --- */
        .content-area { flex-grow: 1; background-color: var(--bg-main); }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- CAPA OSCURA PARA MÓVIL --- */
        .overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; transition: opacity 0.3s;
        }

        /* --- PANTALLA MÓVIL --- */
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .overlay.open { display: block; opacity: 1; }
            .user-name-text { display: none; } /* Ocultar el nombre en móvil por espacio */
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="hamburger" onclick="toggleMenu()">☰</div>
            <div class="logo">🔥 LA FORJA</div>
        </div>
        <div class="topbar-right">
            <button class="btn-icon" id="btn-theme" onclick="toggleTheme()" title="Cambiar Tema">☀️</button>
            <div class="user-info">
                <span class="user-name-text">Erudito</span>
                <button class="btn-icon" style="font-size: 12px; border-color: #e57373; color: #e57373;" onclick="cerrarSesionUniversal()">Salir</button>
            </div>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <div class="main-container">
        
        <!-- MENÚ LATERAL -->
        <aside class="sidebar" id="sidebar">
            <div class="nav-item active" onclick="cargarHerramienta('captura.html', this)">
                <span>📥</span> Alimentador
            </div>
            <div class="nav-item" onclick="cargarHerramienta('traductor.html', this)">
                <span>⚔️</span> Traductor
            </div>
            <div class="nav-item" onclick="cargarHerramienta('glosario.html', this)">
                <span>📖</span> Glosario
            </div>
        </aside>

        <!-- CAPA PARA CERRAR MENÚ EN MÓVIL -->
        <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

        <!-- EL IFRAME DONDE VIVE LA MAGIA -->
        <main class="content-area">
            <!-- Empezamos cargando captura.html por defecto -->
            <iframe id="marco-herramienta" src="captura.html"></iframe>
        </main>
    </div>

    <script>
        // --- 1. PROTECCIÓN DE SESIÓN ---
        // Verificamos si el token existe en el almacenamiento del navegador
        if (!localStorage.getItem('api_token')) {
            // Si no hay token, lo mandamos directo a captura.html (que tiene la pantalla de login)
            // Cuando se loguee ahí, guardará el token y ya podrá usar el Dashboard.
            window.location.href = 'captura.html';
        }

        function cerrarSesionUniversal() {
            localStorage.removeItem('api_token');
            window.location.href = 'captura.html';
        }

        // --- 2. NAVEGACIÓN Y MENÚ ---
        function cargarHerramienta(url, elementoMenu) {
            // Cambiar el iframe
            document.getElementById('marco-herramienta').src = url;
            
            // Cambiar la pestaña activa visualmente
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            elementoMenu.classList.add('active');

            // Si estamos en móvil, cerrar el menú tras hacer clic
            if (window.innerWidth <= 768) {
                toggleMenu();
            }
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        // --- 3. GESTIÓN DEL TEMA (CLARO/OSCURO) ---
        function toggleTheme() {
            const root = document.documentElement;
            const btnTheme = document.getElementById('btn-theme');
            const temaActual = root.getAttribute('data-theme');
            
            const nuevoTema = temaActual === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', nuevoTema);
            btnTheme.innerText = nuevoTema === 'dark' ? '☀️' : '🌙';
            
            // Guardamos la preferencia
            localStorage.setItem('forja_theme', nuevoTema);

            // Avisarle al iframe que cambie de tema también
            const iframe = document.getElementById('marco-herramienta');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ accion: 'cambiarTema', tema: nuevoTema }, '*');
            }
        }

        // Cargar el tema guardado al iniciar
        const temaGuardado = localStorage.getItem('forja_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', temaGuardado);
        document.getElementById('btn-theme').innerText = temaGuardado === 'dark' ? '☀️' : '🌙';

    </script>
</body>
</html>
